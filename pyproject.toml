[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-dynamic-systems"
version = "0.1.0"
description = "Plataforma interactiva de simulacion de sistemas dinamicos con controladores PID"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "control",
    "streamlit",
    "plotly",
    "reportlab",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
